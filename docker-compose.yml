services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: ./cmd/migrate/Dockerfile
      pull: false
    container_name: ecommerce-migrate
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./cmd/auth-service/Dockerfile
      pull: false
    container_name: ecommerce-auth-service
    ports:
      - "50051:50051"
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_GRPC_ADDR: ":50051"
      AUTH_HEALTH_ADDR: ":8081"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-service:
    build:
      context: .
      dockerfile: ./cmd/product-service/Dockerfile
      pull: false
    container_name: ecommerce-product-service
    ports:
      - "50052:50052"
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PRODUCT_GRPC_ADDR: ":50052"
      PRODUCT_HEALTH_ADDR: ":8082"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: .
      dockerfile: ./cmd/order-service/Dockerfile
      pull: false
    container_name: ecommerce-order-service
    ports:
      - "50053:50053"
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ORDER_GRPC_ADDR: ":50053"
      ORDER_HEALTH_ADDR: ":8083"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EVENT_EXCHANGE: "ecommerce.events"
      ORDER_PAYMENT_TIMEOUT_MINUTES: "15"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build:
      context: .
      dockerfile: ./cmd/payment-service/Dockerfile
      pull: false
    container_name: ecommerce-payment-service
    ports:
      - "50056:50056"
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      PAYMENT_GRPC_ADDR: ":50056"
      PAYMENT_HEALTH_ADDR: ":8086"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      ORDER_SERVICE_ADDR: "order-service:50053"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EVENT_EXCHANGE: "ecommerce.events"
      SERVICE_GRPC_TIMEOUT: "3s"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  outbox-worker:
    build:
      context: .
      dockerfile: ./cmd/outbox-worker/Dockerfile
      pull: false
    expose:
      - "8088"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      OUTBOX_HEALTH_ADDR: ":8088"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EVENT_EXCHANGE: "ecommerce.events"
      OUTBOX_POLL_INTERVAL: "5s"
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_MAX_RETRY: "5"
      OUTBOX_RETRY_BASE_DELAY: "1s"
      OUTBOX_LEASE_DURATION: "30s"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cart-service:
    build:
      context: .
      dockerfile: ./cmd/cart-service/Dockerfile
      pull: false
    container_name: ecommerce-cart-service
    ports:
      - "50054:50054"
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    environment:
      CART_GRPC_ADDR: ":50054"
      CART_HEALTH_ADDR: ":8084"
      REDIS_ADDR: "redis:6379"
      PRODUCT_SERVICE_ADDR: "product-service:50052"
      SERVICE_GRPC_TIMEOUT: "3s"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  merchant-service:
    build:
      context: .
      dockerfile: ./cmd/merchant-service/Dockerfile
      pull: false
    container_name: ecommerce-merchant-service
    ports:
      - "50055:50055"
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      MERCHANT_GRPC_ADDR: ":50055"
      MERCHANT_HEALTH_ADDR: ":8085"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: ./cmd/notification-service/Dockerfile
      pull: false
    container_name: ecommerce-notification-service
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      NOTIFICATION_HEALTH_ADDR: ":8087"
      DB_DSN: "root:password@tcp(mysql:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EVENT_EXCHANGE: "ecommerce.events"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: ./cmd/api-gateway/Dockerfile
      pull: false
    container_name: ecommerce-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      PRODUCT_SERVICE_ADDR: "product-service:50052"
      ORDER_SERVICE_ADDR: "order-service:50053"
      CART_SERVICE_ADDR: "cart-service:50054"
      MERCHANT_SERVICE_ADDR: "merchant-service:50055"
      PAYMENT_SERVICE_ADDR: "payment-service:50056"
      GATEWAY_GRPC_TIMEOUT: "3s"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: ecommerce-otel-collector
    profiles:
      - observability
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecommerce-prometheus
    profiles:
      - observability
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  tempo:
    image: grafana/tempo:2.5.0
    container_name: ecommerce-tempo
    profiles:
      - observability
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: ecommerce-grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  mysql_data:
  grafana_data:
  tempo_data:
