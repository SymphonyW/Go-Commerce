name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tee coverage.txt

      - name: Verify Go build
        run: go build ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Upload backend coverage
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage.txt

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - cart-service
          - merchant-service
          - payment-service
          - migrate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build service image
        run: |
          docker build \
            --file "./cmd/${{ matrix.service }}/Dockerfile" \
            --tag "go-commerce/${{ matrix.service }}:ci" \
            .

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs:
      - backend-check
    env:
      INTEGRATION_DB_DSN: root:password@tcp(127.0.0.1:3307)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local
      INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
      INTEGRATION_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Start integration dependencies
        run: docker compose up -d --wait mysql redis rabbitmq

      - name: Show dependency status
        run: docker compose ps

      - name: Run integration tests
        run: go test -tags=integration -v ./...

      - name: Stop integration dependencies
        if: always()
        run: docker compose down -v

  e2e-test:
    name: Checkout E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-check
      - frontend-check
      - docker-build
    env:
      DB_DSN: root:password@tcp(127.0.0.1:3307)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_DB_DSN: root:password@tcp(127.0.0.1:3307)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local
      E2E_READY_TIMEOUT: 90s
      E2E_ORDER_STATUS_TIMEOUT: 45s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Start application stack
        run: docker compose up -d --build --wait

      - name: Show application status
        run: docker compose ps

      - name: Seed demo data
        run: go run ./cmd/seed-data

      - name: Run checkout E2E tests
        run: go test -tags=e2e -v ./tests/e2e

      - name: Collect E2E diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p e2e-logs
          docker compose ps | tee e2e-logs/docker-compose-ps.txt || true
          docker compose logs --tail=200 --no-color > e2e-logs/docker-compose.log || true
          docker compose logs --tail=200 --no-color \
            api-gateway auth-service product-service order-service payment-service \
            cart-service merchant-service outbox-worker notification-service \
            > e2e-logs/services.log || true
          docker compose exec -T mysql mysqladmin ping -h localhost -uroot -ppassword \
            | tee e2e-logs/mysql-health.txt || true
          docker compose exec -T rabbitmq rabbitmq-diagnostics -q check_running \
            | tee e2e-logs/rabbitmq-running.txt || true
          docker compose exec -T rabbitmq rabbitmq-diagnostics -q check_local_alarms \
            | tee e2e-logs/rabbitmq-alarms.txt || true
          docker inspect ecommerce-mysql --format='{{json .State.Health}}' \
            | tee e2e-logs/mysql-container-health.json || true
          docker inspect ecommerce-rabbitmq --format='{{json .State.Health}}' \
            | tee e2e-logs/rabbitmq-container-health.json || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-diagnostics
          path: e2e-logs

      - name: Stop application stack
        if: always()
        run: docker compose down -v
