syntax = "proto3";

package payment;

option go_package = "go-commerce/api/payment";

message Payment {
  int64 id = 1;
  string payment_no = 2;
  int64 order_id = 3;
  int64 user_id = 4;
  int64 amount_cents = 5;
  string status = 6;
  string payment_method = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CreatePaymentRequest {
  int64 order_id = 1;
  int64 user_id = 2;
  string payment_method = 3;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message PaymentActionRequest {
  int64 id = 1;
  int64 user_id = 2;
  string idempotency_key = 3;
}

message PaymentActionResponse {
  Payment payment = 1;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc MarkPaymentSucceeded(PaymentActionRequest) returns (PaymentActionResponse);
  rpc MarkPaymentFailed(PaymentActionRequest) returns (PaymentActionResponse);
}
